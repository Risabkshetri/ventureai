name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/opt/ai-startup-evaluation"
            REPO_URL="https://github.com/Risabkshetri/ventureai.git"

            echo "Checking application directory..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First deployment..."

              sudo mkdir -p /opt

              if [ -d "$APP_DIR" ]; then
                sudo rm -rf "$APP_DIR"
              fi

              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            python -m pip install --upgrade pip

            pip install -r requirements.txt

            if [ -f "pyproject.toml" ]; then
              pip install -e .
            fi

            if command -v alembic >/dev/null 2>&1; then
              alembic upgrade head || true
            fi

            sudo systemctl daemon-reload

            if systemctl list-unit-files | grep -q "^ai-startup.service"; then
              sudo systemctl restart ai-startup
            else
              echo "ai-startup.service not found. Skipping restart."
            fi

            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            echo "Deployment completed successfully!"
