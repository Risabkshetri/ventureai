name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            APP_DIR="/opt/ai-startup-evaluation"
            REPO_URL="https://github.com/Risabkshetri/ventureai.git"

            echo "========== Checking repository =========="

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First deployment..."

              sudo mkdir -p /opt

              if [ -d "$APP_DIR" ]; then
                sudo rm -rf "$APP_DIR"
              fi

              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "========== Updating code =========="

            git fetch origin
            git reset --hard origin/main

            echo "========== Installing system packages =========="

            sudo apt-get update

            sudo apt-get install -y \
              python3 \
              python3-pip \
              python3-venv \
              build-essential

            echo "========== Preparing virtual environment =========="

            if [ ! -f "venv/bin/activate" ]; then
              echo "Creating fresh virtual environment..."

              rm -rf venv

              python3 -m venv venv
            fi

            source venv/bin/activate

            echo "========== Installing Python packages =========="

            python -m pip install --upgrade pip setuptools wheel

            pip install -r requirements.txt

            echo "========== Running migrations =========="

            if command -v alembic >/dev/null 2>&1; then
              alembic upgrade head || true
            fi

            echo "========== Restarting services =========="

            sudo systemctl daemon-reload

            if systemctl list-unit-files | grep -q "^ai-startup.service"; then
              sudo systemctl restart ai-startup
              sudo systemctl status ai-startup --no-pager
            else
              echo "ai-startup.service not found."
            fi

            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            echo "========== Deployment Successful =========="
