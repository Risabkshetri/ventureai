[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Lenient mode to start — tighten over time
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false     # allow untyped functions for now
check_untyped_defs = true         # but still check their bodies
ignore_missing_imports = true     # don't fail on untyped third-party libs

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

